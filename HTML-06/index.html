<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
      }
      .header {
        width: 100vw;
        height: 10vh;
        background-color: red;
      }
      .main {
        background-color: aqua;
        height: 80vh;
      }
      .sidebar {
        width: 20%;
        height: 100vh; /*-- this vh make sidebar overflow the footer because vh takes full hight of the screen  --*/
        float: left;
        background-color: blueviolet;
      }
      .content {
        width: 80%;
        height: 100%;
        float: left;
        background-color: blue;
      }
      .footer {
        height: 10vh;
        width: 100vw;
        background-color: gold;
      }
    </style>
  </head>
  <body>
    <!-- Page layout by using DEV -->

    <div class="header">
      <!-- <img src="../HTML-01/images/Screenshot 2025-11-20 125421.png" alt="" height="100px"> -->
    </div>
    <div class="main">
      <div class="sidebar"></div>
      <div class="content"></div>
    </div>
    <div class="footer"></div>
  </body>
</html>
