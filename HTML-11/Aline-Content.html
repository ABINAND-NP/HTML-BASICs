<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Wrap</title>
    <style>
        .container{
            height: 100vh;
            border-color: rgb(163, 107, 22);
            display: flex;
            flex-direction: column;

        }
        header{
            height: 10vh;
            background-color: gray;
        }
        nav{
            height: 10vh;
            background-color: aqua;
        }
        .content{
           flex: 1;   
           display: flex;           
           background-color: green;           
           /* flex-direction: row; */
           flex-wrap: wrap;       /*-- item central aline intuvigualy --*/ 
           /* align-items: flex-start;  /*-- default --*/        
           /* align-items: flex-end;        */
           /* align-items: center;    */
           /* align-content: flex-start; */
           /* align-content: flex-end; */
           /* align-content: center; */
           align-content: stretch;          

        }
        .box{
            /* height: 200px;  */
            width: 200px;
            background-color: antiquewhite;
            margin: 5px;
        }
        footer{
            height: 10vh;
            background-color: brown;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>

    </header>
    <nav>

    </nav>
    <div class="content">
        <div class="box">1</div>
        <div class="box" >2</div>   <!--style="align-self: flex-start;" , -->
        <div class="box">3</div>    <!--style="align-self: flex-end;" , -->
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
        <div class="box">13</div>
        

    </div>
    <footer>

    </footer>
    </div>
    
</body>
</html>
