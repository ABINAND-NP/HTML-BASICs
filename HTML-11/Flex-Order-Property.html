<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Order-Property</title>

    <style>
        .container {            
            display: flex;
        }
        .box-1,.box-2,.box-3{
            height: 100px;
            width: 100px;            
        }
        .box-1{
            background-color: red;
            order: 3;
        }
        .box-2{
            background-color: green;
            order: 1;
        }
        .box-3{
            background-color: yellow;
            order: 2;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="box-1" >1</div>
        <div class="box-2" >2</div>
        <div class="box-3" >3</div>
    </div>
</body>
</html>
