<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Wrap</title>
    <style>
        .container{
            height: 100%;
            border-color: blanchedalmond;
            display: flex;
            flex-direction: column;

        }
        header{
            height: 10vh;
            background-color: gray;
        }
        nav{
            height: 10vh;
            background-color: aqua;
        }
        .content{
           flex: 1;
           display: flex;           
           background-color: green;
           flex-wrap: wrap;           
           flex-direction: column;
           height: 600px;
           

        }
        .box{
            height: 100px;
            width: 100px;
            background-color: antiquewhite;
            margin: 5px;
        }
        footer{
            height: 10vh;
            background-color: brown;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>

    </header>
    <nav>

    </nav>
    <div class="content">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>

    </div>
    <footer>

    </footer>
    </div>
    
</body>
</html>
